# Castle Excellent (Japan) complete iNES image layout.
#
# PRG is one fixed 32 KiB CPU image at $8000-$FFFF. CHR is four
# switchable 8 KiB banks emitted as one 32 KiB cartridge payload.

MEMORY {
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    PRG:    file = %O, start = $8000, size = $8000, fill = yes;
    CHR:    file = %O, start = $0000, size = $8000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    PRG:    load = PRG,    type = ro;
    CHR:    load = CHR,    type = ro;
}
